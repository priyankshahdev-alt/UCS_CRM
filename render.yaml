# Render Blueprint for the OpenWA WhatsApp gateway and the Indra OCR service.
#
# Render reads this file from the ROOT of the repository. Each service is built from its own
# subfolder (`rootDir` below), so keep this file where it is and do not move it into them.
#
# Create the Blueprint at https://dashboard.render.com/blueprints → "New Blueprint Instance".
# Secrets marked `sync: false` are prompted for on creation and never stored in git.
#
# Two things make this stateless, and both are required:
#   1. BAILEYS_AUTH_STORE=database — creds + Signal keys live in Postgres, not in ./data/baileys.
#   2. API_MASTER_KEY — the admin key is re-seeded from this env var on every boot, because the
#      SQLite file that would otherwise hold it is wiped with the container's ephemeral disk.

services:
  - type: web
    name: ucs-openwa
    runtime: docker
    # `free` works only for a handful of numbers and sleeps after 15 min. Use `standard` (2 GB) for
    # real use: 512 MB cannot hold NestJS + Baileys + media reliably.
    plan: free
    region: singapore
    rootDir: openwa
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENGINE_TYPE
        value: baileys
      - key: AUTO_START_SESSIONS
        value: 'true'

      # --- 1. auth state in Postgres, not on disk ---------------------------------------------
      - key: BAILEYS_AUTH_STORE
        value: database

      - key: DATABASE_TYPE
        value: postgres
      - key: DATABASE_SYNCHRONIZE
        value: 'false'
      - key: DATABASE_SSL
        value: 'true'
      - key: POSTGRES_SCHEMA
        value: openwa
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: '5432'
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        sync: false

      # --- 2. the admin key survives restarts ------------------------------------------------
      # Render generates one value and keeps it across deploys. Copy it into the UCS CRM backend as
      # OPENWA_API_KEY. In production it must be >= the minimum length enforced by the app.
      - key: API_MASTER_KEY
        generateValue: true

      # --- media: no disk on Render, so S3-compatible storage (R2 / S3 / B2) -------------------
      - key: STORAGE_TYPE
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # --- single instance: no shared Redis/queue/cache --------------------------------------
      - key: REDIS_ENABLED
        value: 'false'
      - key: QUEUE_ENABLED
        value: 'false'
      - key: CACHE_ENABLED
        value: 'false'

      # Set after the first deploy to the public URL, e.g. https://ucs-openwa.onrender.com
      - key: BASE_URL
        sync: false

  # --- Indra OCR (Python + FastAPI) ------------------------------------------------------------
  #
  # Docker image with the ~89 MB of Indra OCR weights baked in, so a cold start needs no
  # Hugging Face download. `plan: free` is 512 MB / 0.1 CPU: it fits, but a scan is slow and the
  # service sleeps after 15 min idle (cold start 1-3 min). For real use switch to `0.5c-512mb`
  # ($7/mo, no sleep) or `1c-2g` ($25/mo, 1 CPU / 2 GB).
  #
  # After the first deploy, copy the generated OCR_API_KEY from this service's Environment tab
  # into the Node backend as INDRA_OCR_KEY, and set INDRA_OCR_URL to this service's URL.
  - type: web
    name: ucs-ocr
    runtime: docker
    plan: free
    region: singapore
    rootDir: ocr
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    autoDeploy: false
    envVars:
      - key: HOST
        value: 0.0.0.0
      # One ONNX thread keeps the process inside the free instance's small CPU/RAM budget.
      - key: INDRA_THREADS
        value: '1'
      - key: INDRA_MATH
        value: '0'
      - key: OCR_PRELOAD
        value: '1'
      # Cards do not need 3000 px; 2000 keeps peak memory down on a 512 MB instance.
      - key: OCR_MAX_IMAGE_SIDE
        value: '2000'
      - key: OCR_MAX_UPLOAD_MB
        value: '10'
      - key: OCR_API_KEY
        generateValue: true
